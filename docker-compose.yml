services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: makemoneyordie
      POSTGRES_USER: makemoneyordie
      POSTGRES_PASSWORD: makemoneyordie
    volumes:
      - makemoneyordie_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U makemoneyordie -d makemoneyordie"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      target: dev
    ports:
      - "4000:4000"
    volumes:
      - makemoneyordie_uploads:/app/uploads
    environment:
      DJANGO_DEBUG: "1"
      DATABASE_URL: postgres://makemoneyordie:makemoneyordie@postgres:5432/makemoneyordie
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20

  scheduler:
    build:
      context: ./backend
      target: dev
    command: ["python", "manage.py", "run_generation_scheduler"]
    environment:
      DJANGO_DEBUG: "1"
      DATABASE_URL: postgres://makemoneyordie:makemoneyordie@postgres:5432/makemoneyordie
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:4000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  makemoneyordie_postgres_data:
  makemoneyordie_uploads:
