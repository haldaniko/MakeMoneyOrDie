name: makemoneyordie

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: makemoneyordie
      POSTGRES_USER: makemoneyordie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - makemoneyordie_prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U makemoneyordie -d makemoneyordie"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    ports:
      - "8018:4000"
    volumes:
      - makemoneyordie_prod_uploads:/app/uploads
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-makemoneyordie.com,www.makemoneyordie.com}
      CORS_ALLOWED_ORIGINS: https://makemoneyordie.com,https://www.makemoneyordie.com
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-meta-llama/llama-3.1-8b-instruct}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-https://makemoneyordie.com}
      OPENROUTER_TIMEOUT_MS: ${OPENROUTER_TIMEOUT_MS:-90000}
      OPENROUTER_MAX_INPUT_CHARS: ${OPENROUTER_MAX_INPUT_CHARS:-16000}
      OPENROUTER_MAX_OUTPUT_TOKENS: ${OPENROUTER_MAX_OUTPUT_TOKENS:-9000}
      OPENROUTER_TEMPERATURE: ${OPENROUTER_TEMPERATURE:-0.7}
      OPENROUTER_RETRY_ATTEMPTS: ${OPENROUTER_RETRY_ATTEMPTS:-3}
      PGHOST: postgres
      PGDATABASE: makemoneyordie
      PGUSER: makemoneyordie
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; host=os.environ['DJANGO_ALLOWED_HOSTS'].split(',')[0]; urllib.request.urlopen(urllib.request.Request('http://localhost:4000/api/health', headers={'Host': host}), timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20

  scheduler:
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    command: ["python", "manage.py", "run_generation_scheduler"]
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-meta-llama/llama-3.1-8b-instruct}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-https://makemoneyordie.com}
      OPENROUTER_TIMEOUT_MS: ${OPENROUTER_TIMEOUT_MS:-90000}
      OPENROUTER_MAX_INPUT_CHARS: ${OPENROUTER_MAX_INPUT_CHARS:-16000}
      OPENROUTER_MAX_OUTPUT_TOKENS: ${OPENROUTER_MAX_OUTPUT_TOKENS:-9000}
      OPENROUTER_TEMPERATURE: ${OPENROUTER_TEMPERATURE:-0.7}
      OPENROUTER_RETRY_ATTEMPTS: ${OPENROUTER_RETRY_ATTEMPTS:-3}
      PGHOST: postgres
      PGDATABASE: makemoneyordie
      PGUSER: makemoneyordie
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    ports:
      - "9005:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  makemoneyordie_prod_postgres_data:
  makemoneyordie_prod_uploads:
