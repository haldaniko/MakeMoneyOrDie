server {
    server_name makemoneyordie.com www.makemoneyordie.com;

    location / {
        proxy_pass http://127.0.0.1:9005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/makemoneyordie.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/makemoneyordie.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    server_name api.makemoneyordie.com;
    client_max_body_size 12M;

    location / {
        proxy_pass http://127.0.0.1:8018;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/makemoneyordie.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/makemoneyordie.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.makemoneyordie.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = makemoneyordie.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name makemoneyordie.com www.makemoneyordie.com;
    return 404; # managed by Certbot
}

server {
    if ($host = api.makemoneyordie.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name api.makemoneyordie.com;
    return 404; # managed by Certbot
}
